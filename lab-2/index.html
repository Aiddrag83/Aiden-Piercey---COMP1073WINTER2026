<!-- Initial commit: create HTML structure for RGB color changer -->
<!DOCTYPE html>
<html lang="en">
<head>
	<!-- Add commit: set meta charset -->
	<meta charset="utf-8" />

	<!-- Add commit: set page title -->
	<title>Lab 5 | COMP1073 Client-Side JavaScript</title>

	<!-- Add commit: link normalize.css for cross-browser consistency -->
	<link href="css/normalize.css" rel="stylesheet" />

	<!-- Add commit: link custom styles -->
	<link href="css/styles.css" rel="stylesheet" />

	<!-- Add commit: link JavaScript for RGB color changer -->
	<script src="js/page-color-changer.js"></script>
</head>
<body>
	<!-- Add commit: add main heading -->
	<h1>Lab 1</h1>

	<!-- Add commit: add description of functionality -->
	<p>This script will enable the user to adjust the below range input elements to modify the <abbr title="Red, Green, Blue">RGB</abbr> values of the <code>background-color</code> CSS property of the HTML element.</p>

	<!-- Add commit: add red slider input -->
	<label for="red">Red</label>
	<input id="red" type="range" min="0" max="255" value="0" />

	<!-- Add commit: add green slider input -->
	<label for="green">Green</label>
	<input id="green" type="range" min="0" max="255" value="0" />

	<!-- Add commit: add blue slider input -->
	<label for="blue">Blue</label>
	<input id="blue" type="range" min="0" max="255" value="0" />
</body>
</html>
